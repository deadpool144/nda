services:
  - type: web
    name: lexforge-contract-platform
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false # You will need to enter this secret key in the Render Dashboard
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: EMBEDDING_MODEL
        value: models/gemini-embedding-001
      # To use a Render PostgreSQL database, you can reference its internal connection string here:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: lexforge-db
      #     property: connectionString
